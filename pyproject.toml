[project]
name = "demandops-lite"
version = "0.1.0"
description = "End-to-end demand prediction pipeline with ML lifecycle best practices"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pandera[polars]>=0.21.0",
    "lightgbm>=4.5.0",
    "mlflow>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.21.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pyarrow>=17.0.0",
    "joblib>=1.3.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.9.0",
]
dbt = [
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["demandops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
